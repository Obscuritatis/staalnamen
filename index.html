<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Staalnamen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: smalle werkkolom; overzicht van sites → staalnamen van één site (breadcrumb-navigatie). Zelfde stijl als de veiligheidsrondes. */
:root {
  --bg: #f5f6f4;
  --surface: #ffffff;
  --fg: #1d2220;
  --muted: #5f6964;
  --line: #dde1de;
  --accent: #c8281e;      /* signaalrood, spaarzaam */
  --accent-fg: #ffffff;
  --open: #b0261c;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141816; --surface: #1d2220; --fg: #e9ecea; --muted: #9aa49f; --line: #2f3633;
    --accent: #ef5a4c; --accent-fg: #1a0b09; --open: #f07a6e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141816; --surface: #1d2220; --fg: #e9ecea; --muted: #9aa49f; --line: #2f3633;
  --accent: #ef5a4c; --accent-fg: #1a0b09; --open: #f07a6e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 24px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 2.2rem; text-transform: uppercase; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.25rem; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.who { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.login { max-width: 420px; }
.sign { width: 40px; height: 40px; flex: none; border-radius: 4px; background: var(--accent); display: grid; place-items: center; }
.sign svg { width: 24px; height: 24px; }
.eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .9rem; color: var(--muted); }
.crumbs button { background: none; border: 0; padding: 0; font: inherit; color: var(--fg); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.muted { color: var(--muted); }
button, input, select, textarea { font: inherit; color: inherit; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--radius); cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--open); }
.btn.small { padding: 4px 10px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Sites */
.sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.site { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; cursor: pointer; display: grid; gap: 10px; }
.site:hover { border-color: var(--muted); }
.site h3 { font-size: 1.35rem; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--bg); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.last { font-size: .85rem; color: var(--muted); }

/* Panels & forms */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.field { display: grid; gap: 4px; flex: 1 1 180px; min-width: 0; }
.field.wide { flex-basis: 100%; }
fieldset.loc-set { border: 0; padding: 0; margin: 0; }
fieldset.loc-set legend { padding: 0; margin-bottom: 4px; }
label.lbl.sub { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: .85rem; }
.lbl { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; color: var(--muted); }
input[type=text], input[type=date], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); padding: 8px 10px; border-radius: var(--radius); }
textarea { min-height: 72px; resize: vertical; }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }

/* Staalnamen */
.list { display: grid; gap: 8px; }
.staal { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--radius); padding: 12px 16px; display: grid; gap: 8px; }
.staal-top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; justify-content: space-between; }
.subject { font-weight: 600; }
.date { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.staal p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.meta { font-size: .9rem; color: var(--muted); overflow-wrap: anywhere; }
.fotos { display: flex; flex-wrap: wrap; gap: 8px; }
.foto-veld { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.foto-veld input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.foto-veld label.btn { cursor: pointer; }
.foto-keuze { position: relative; }
.foto-keuze button { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; padding: 0; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--open); cursor: pointer; line-height: 1; font-weight: 600; }
.duim { width: 96px; height: 72px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); display: block; }
button.duim-knop { padding: 0; border: 0; background: none; cursor: zoom-in; }
.groot { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.9); display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
.groot img { display: block; width: auto; height: auto; object-fit: contain; border-radius: 4px;
  max-width: calc(100vw - 32px);
  max-height: calc(100vh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  max-height: calc(100dvh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
.staal-bottom { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: flex-end; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button[aria-pressed=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 24px 16px; text-align: center; color: var(--muted); }
.banner { padding: 10px 14px; border-radius: var(--radius); background: #fbefd9; color: #9a5b00; font-size: .9rem; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-size: .9rem; }
@media (prefers-reduced-motion: no-preference) { .site, .btn { transition: border-color .15s, filter .15s; } }

/* Rondes en vaste punten */
:root { --ok: #1d7a4c; --ok-bg: #e3f2ea; --open-bg: #fbe6e3; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ok: #5cc98f; --ok-bg: #173327; --open-bg: #3b1a17; } }
:root[data-theme="dark"] { --ok: #5cc98f; --ok-bg: #173327; --open-bg: #3b1a17; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.open { background: var(--open-bg); color: var(--open); }
.ronde { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; cursor: pointer; text-align: left; width: 100%; }
.ronde:hover { border-color: var(--muted); }
.ronde .date { min-width: 7.5em; font-size: 1.3rem; }
.staal.genomen { border-left-color: var(--ok); }
.staal.te-doen { border-left-color: var(--line); }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; }
.check input { width: 20px; height: 20px; accent-color: var(--ok); }
.tabel-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); max-height: 320px; }
.tabel-wrap table { border-collapse: collapse; font-size: .85rem; width: 100%; }
.tabel-wrap th, .tabel-wrap td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; white-space: nowrap; }
.tabel-wrap th { position: sticky; top: 0; background: var(--surface); }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="sign" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M9 2.5h6M10 2.5v6.2L4.8 18.3A2.2 2.2 0 0 0 6.7 21.5h10.6a2.2 2.2 0 0 0 1.9-3.2L14 8.7V2.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.2 15h9.6l2 3.5a1 1 0 0 1-.9 1.5H6.1a1 1 0 0 1-.9-1.5Z" fill="#fff"/></svg>
    </div>
    <div>
      <div class="eyebrow">Registratie</div>
      <h1>Staalnamen</h1>
    </div>
    <div id="who" class="who" hidden><span id="who-mail"></span><button class="btn small" id="logout" type="button">Afmelden</button></div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const SITES = [
  { id: "pz-tienen", naam: "Psychiatrisch ziekenhuis Tienen" },
  { id: "wzc-sint-alexius", naam: "WZC Sint-Alexius" },
  { id: "wzc-passionisten", naam: "WZC-Passionisten" },
  { id: "wzc-huize-nazareth", naam: "WZC-Huize Nazareth" },
  { id: "psc-leuven", naam: "PSC-Leuven" },
];
// Soorten rondes. "temperatuur": per punt ook een watertemperatuur invullen.
const TYPES = [
  { id: "legionella", naam: "Legionella", ronde: "Ronde legionella", temperatuur: true },
  { id: "textiel", naam: "Textielstalen", ronde: "Ronde textielstalen", temperatuur: false },
];
const BUCKET = "staalnamen-fotos";

let sb = null, sessie = null, ready = false;
let lijsten = [];  // {site, type, kolommen[], punten[[...]], bijgewerkt}
let rondes = [];   // {id, site, type, datum, kolommen[], aangemaakt}
let punten = [];   // {id, rondeId, volgorde, waarden[], genomen, staalnummer, temperatuur, opmerkingen, fotos[]}
let state = { view: "sites", site: null, type: null, ronde: null, filter: "alle", edit: null, confirm: null, editRonde: false, editLijst: false };

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fmtDate = iso => { if (!iso) return "—"; const [y, m, d] = iso.slice(0, 10).split("-"); return `${d}/${m}/${y}`; };
const siteNaam = id => (SITES.find(s => s.id === id) || {}).naam || id;
const typeVan = id => TYPES.find(t => t.id === id) || { id, naam: id, ronde: "Ronde " + id, temperatuur: false };
const lijstVan = (site, type) => lijsten.find(l => l.site === site && l.type === type) || null;
const rondesVan = (site, type) => rondes.filter(r => r.site === site && r.type === type).sort((a, b) => (b.datum || "").localeCompare(a.datum || "") || (b.aangemaakt || "").localeCompare(a.aangemaakt || ""));
const puntenVan = rondeId => punten.filter(p => p.rondeId === rondeId).sort((a, b) => a.volgorde - b.volgorde);
// Een punt toont alle ingevulde kolommen uit Excel, bv. "12 · Gebouw A · A0.12 · Douche".
const puntTitel = (p, i) => p.waarden.filter(Boolean).join(" · ") || `Punt ${i + 1}`;

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200);
}
function banner(msg) { const b = $("#banner"); b.textContent = msg || ""; b.hidden = !msg; }
function voortgang(ps) {
  const n = ps.filter(p => p.genomen).length;
  return `<span class="pill ${ps.length && n === ps.length ? "ok" : ""}">${n} van ${ps.length} genomen</span>`;
}

function go(view, extra = {}) {
  wisKeuze("e");
  state = { ...state, view, edit: null, confirm: null, editRonde: false, editLijst: false, ...extra };
  render();
  window.scrollTo({ top: 0 });
}

/* ---------- Views ---------- */
let lastKey = "";
function render() {
  const v = $("#view");
  const key = [state.view, state.site, state.type, state.ronde, state.edit, state.editLijst].join(":");
  const keep = {};
  if (key === lastKey) v.querySelectorAll("form input[id]:not([type=file]), form textarea[id], form select[id]").forEach(el => keep[el.id] = el.type === "checkbox" ? el.checked : el.value);
  if (state.view === "ronde" && ready && !rondes.find(r => r.id === state.ronde)) state.view = "type";
  if (!sessie) { v.innerHTML = viewLogin(); lastKey = ""; return; }
  v.innerHTML = state.view === "site" ? viewSite() : state.view === "type" ? viewType() : state.view === "ronde" ? viewRonde() : viewSites();
  for (const id in keep) { const el = document.getElementById(id); if (el && el.closest("form")) { if (el.type === "checkbox") el.checked = keep[id]; else el.value = keep[id]; } }
  if (state.editLijst) toonLijstVoorbeeld();
  lastKey = key;
  toonFotos();
}

function viewLogin() {
  if (!sb) return '<div class="empty">Laden…</div>';
  return `<form class="panel login" id="form-login">
    <h2>Aanmelden</h2>
    <p class="muted" style="margin:0">Vul je e-mailadres in. Je krijgt een mail met een link om je aan te melden.</p>
    <div class="field"><label class="lbl" for="l-mail">E-mailadres</label><input type="text" inputmode="email" autocomplete="email" id="l-mail" required></div>
    <button class="btn primary" type="submit">Stuur aanmeldlink</button>
  </form>`;
}

function crumbs(...delen) {
  return `<nav class="crumbs">${delen.map(([tekst, attr]) => attr ? `<button ${attr}>${esc(tekst)}</button>` : `<span>${esc(tekst)}</span>`).join("<span>/</span>")}</nav>`;
}

function viewSites() {
  const cards = SITES.map(s => {
    const regels = TYPES.map(t => {
      const rs = rondesVan(s.id, t.id);
      return `<div class="last"><strong>${esc(t.naam)}</strong>: ${!ready ? "laden…" : rs.length ? `${rs.length} ${rs.length === 1 ? "ronde" : "rondes"}, laatste ${fmtDate(rs[0].datum)}` : "nog geen ronde"}</div>`;
    }).join("");
    return `<button class="site" data-go-site="${s.id}"><h3>${esc(s.naam)}</h3><div>${regels}</div></button>`;
  }).join("");
  return `<div style="display:grid;gap:12px"><p class="muted" style="margin:0">Kies een site om een staalnameronde te starten of op te volgen.</p><div class="sites">${cards}</div></div>`;
}

function viewSite() {
  const s = state.site;
  const cards = TYPES.map(t => {
    const rs = rondesVan(s, t.id), l = lijstVan(s, t.id);
    return `<button class="site" data-go-type="${t.id}">
      <h3>${esc(t.ronde)}</h3>
      <div class="stats"><span class="pill">${rs.length} ${rs.length === 1 ? "ronde" : "rondes"}</span><span class="pill ${l && l.punten.length ? "" : "open"}">${l ? l.punten.length : 0} vaste punten</span></div>
      <div class="last">${rs.length ? "Laatste ronde " + fmtDate(rs[0].datum) : "Nog geen ronde"}</div>
    </button>`;
  }).join("");
  return `<div style="display:grid;gap:20px">
    ${crumbs(["Alle sites", "data-go-sites"], [siteNaam(s)])}
    <h2>${esc(siteNaam(s))}</h2>
    <div class="sites">${cards}</div>
  </div>`;
}

function viewType() {
  const s = state.site, t = typeVan(state.type);
  const l = lijstVan(s, t.id), n = l ? l.punten.length : 0;
  const rs = rondesVan(s, t.id);
  const items = rs.map(r => `<button class="ronde" data-go-ronde="${r.id}"><span class="date">${fmtDate(r.datum)}</span><span class="stats">${voortgang(puntenVan(r.id))}</span></button>`).join("");
  const nieuw = n
    ? `<form class="panel" id="form-ronde"><h3>Nieuwe ronde</h3>
        <p class="muted" style="margin:0">De ronde krijgt de ${n} vaste punten van deze site.</p>
        <div class="row">
          <div class="field" style="flex:0 1 180px"><label class="lbl" for="r-datum">Datum</label><input type="date" id="r-datum" required value="${today()}"></div>
          <button class="btn primary" type="submit">Maak nieuwe ronde aan</button>
        </div></form>`
    : `<div class="panel"><h3>Nieuwe ronde</h3><p style="margin:0">Er zijn nog geen vaste punten voor deze ronde. Plak ze eerst hieronder vanuit Excel.</p></div>`;
  return `<div style="display:grid;gap:20px">
    ${crumbs(["Alle sites", "data-go-sites"], [siteNaam(s), `data-go-site="${s}"`], [t.naam])}
    <div><div class="eyebrow">${esc(siteNaam(s))}</div><h2>${esc(t.ronde)}</h2></div>
    ${nieuw}
    <div style="display:grid;gap:10px">
      <h3>Rondes</h3>
      ${!ready ? '<div class="empty">Rondes laden…</div>' : items ? `<div class="list">${items}</div>` : '<div class="empty">Nog geen rondes.</div>'}
    </div>
    ${viewLijst(l)}
  </div>`;
}

function viewLijst(l) {
  if (state.editLijst) return `<form class="panel" id="form-lijst">
      <h3>Vaste punten plakken</h3>
      <p class="muted" style="margin:0">Selecteer in Excel de rijen van de loopronde (met de kolomtitels erbij), kopieer ze en plak ze hieronder. De huidige lijst wordt vervangen. Rondes die al bestaan, veranderen niet.</p>
      <div class="field wide"><label class="lbl" for="lijst-plak">Geplakt uit Excel</label><textarea id="lijst-plak" style="min-height:140px;font-family:ui-monospace,monospace;font-size:.85rem" placeholder="Plak hier (Ctrl+V)"></textarea></div>
      <label class="check"><input type="checkbox" id="lijst-titels" checked> Eerste rij bevat de kolomtitels</label>
      <div id="lijst-voorbeeld"></div>
      <div class="actions" style="justify-content:flex-end"><button type="button" class="btn" data-cancel-lijst>Annuleren</button><button class="btn primary" type="submit">Vaste punten opslaan</button></div>
    </form>`;
  const n = l ? l.punten.length : 0;
  return `<div class="panel">
    <div class="head"><h3>Vaste punten (${n})</h3><button class="btn small" data-edit-lijst>${n ? "Vervangen vanuit Excel" : "Plakken vanuit Excel"}</button></div>
    ${n ? `<p class="muted" style="margin:0">Laatst aangepast op ${fmtDate(l.bijgewerkt)}.</p>${tabelHtml(l.kolommen, l.punten)}` : '<p class="muted" style="margin:0">Nog geen vaste punten.</p>'}
  </div>`;
}

function tabelHtml(kolommen, rijen) {
  return `<div class="tabel-wrap"><table><thead><tr><th>#</th>${kolommen.map(k => `<th>${esc(k)}</th>`).join("")}</tr></thead>
    <tbody>${rijen.map((r, i) => `<tr><td class="muted">${i + 1}</td>${kolommen.map((_, k) => `<td>${esc(r[k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function puntForm(p, t) {
  return `<div class="row">
      <div class="field"><label class="lbl" for="e-staalnummer">Staalnummer</label><input type="text" id="e-staalnummer" value="${esc(p.staalnummer)}" placeholder="bv. etiket van het labo"></div>
      ${t.temperatuur ? `<div class="field" style="flex-basis:140px"><label class="lbl" for="e-temperatuur">Temperatuur (°C)</label><input type="text" inputmode="decimal" id="e-temperatuur" value="${esc(p.temperatuur)}" placeholder="bv. 58"></div>` : ""}
      <div class="field wide"><label class="lbl" for="e-opmerkingen">Opmerkingen</label><textarea id="e-opmerkingen">${esc(p.opmerkingen)}</textarea></div>
      <div class="field wide"><span class="lbl">Foto's</span>
        <div class="foto-veld">
          ${fotoVoorbeelden("e", p)}

/* ---------- Plakken uit Excel ---------- */
// Excel kopieert als tekst met tabs tussen de cellen; cellen met een regeleinde staan tussen aanhalingstekens.
function leesTabel(tekst) {
  tekst = tekst.replace(/\r\n?/g, "\n");
  const scheiding = tekst.includes("\t") ? "\t" : tekst.includes(";") ? ";" : "\t";
  const rijen = []; let rij = [], cel = "", q = false;
  for (let i = 0; i < tekst.length; i++) {
    const c = tekst[i];
    if (q) { if (c === '"') { if (tekst[i + 1] === '"') { cel += '"'; i++; } else q = false; } else cel += c; }
    else if (c === '"' && cel === "") q = true;
    else if (c === scheiding) { rij.push(cel); cel = ""; }
    else if (c === "\n") { rij.push(cel); rijen.push(rij); rij = []; cel = ""; }
    else cel += c;
  }
  if (cel || rij.length) { rij.push(cel); rijen.push(rij); }
  return rijen.map(r => r.map(c => c.trim())).filter(r => r.some(Boolean));
}
function lijstUitPlak() {
  const rijen = leesTabel($("#lijst-plak").value);
  const titels = $("#lijst-titels").checked;
  const breedte = Math.max(0, ...rijen.map(r => r.length));
  const kop = titels && rijen.length ? rijen[0] : [];
  const kolommen = Array.from({ length: breedte }, (_, i) => kop[i] || (i === 0 && !titels ? "Punt" : `Kolom ${i + 1}`));
  const ps = (titels ? rijen.slice(1) : rijen).map(r => kolommen.map((_, i) => r[i] || ""));
  return { kolommen, punten: ps };
}
function toonLijstVoorbeeld() {
  const el = $("#lijst-voorbeeld"); if (!el) return;
  const l = lijstUitPlak();
  el.innerHTML = l.punten.length ? `<div style="display:grid;gap:6px"><span class="lbl">Voorbeeld: ${l.punten.length} punten</span>${tabelHtml(l.kolommen, l.punten)}</div>` : "";
}

/* ---------- Foto's (Supabase Storage, bucket "staalnamen-fotos") ---------- */
const fotoUrls = new Map();
async function fotoUrl(pad) {
  if (fotoUrls.has(pad)) return fotoUrls.get(pad);
  const { data } = await sb.storage.from(BUCKET).createSignedUrl(pad, 60 * 60 * 12);
  const url = data && data.signedUrl;
  if (url) fotoUrls.set(pad, url);
  return url;
}
function bewaarFoto(pad, blob) { return sb.storage.from(BUCKET).upload(pad, blob, { upsert: true, contentType: "image/jpeg" }); }
async function wisFotos(paden) {
  paden = (paden || []).filter(Boolean); if (!paden.length) return;
  paden.forEach(p => fotoUrls.delete(p));
  try { await sb.storage.from(BUCKET).remove(paden); } catch (e) { console.error(e); }
}
function toonFotos() {
  document.querySelectorAll("img[data-foto]").forEach(async img => {
    const url = await fotoUrl(img.dataset.foto);
    if (url && img.isConnected) img.src = url;
  });
}
// Foto verkleinen tot max. 1600 px, JPEG: kleiner bestand, sneller opladen.
async function verklein(file) {
  const bron = await createImageBitmap(file).catch(() => null);
  if (!bron) return file;
  const k = Math.min(1, 1600 / Math.max(bron.width, bron.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bron.width * k); c.height = Math.round(bron.height * k);
  c.getContext("2d").drawImage(bron, 0, 0, c.width, c.height);
  return new Promise(ok => c.toBlob(b => ok(b || file), "image/jpeg", 0.8));
}
// Gekozen maar nog niet opgeslagen foto's in het invulformulier.
const fotoNieuw = { e: [] };            // [{ blob, url }]
const fotoWeg = { e: new Set() };       // bestaande paden die weg moeten
function fotoVoorbeelden(pre, p) {
  const bestaand = (p.fotos || []).filter(f => !fotoWeg[pre].has(f)).map(f =>
    `<div class="foto-keuze"><img class="duim" data-foto="${esc(f)}" alt="Huidige foto"><button type="button" data-foto-weg="${pre}" data-pad="${esc(f)}" aria-label="Foto verwijderen">×</button></div>`);
  const nieuw = fotoNieuw[pre].map((f, i) =>
    `<div class="foto-keuze"><img class="duim" src="${f.url}" alt="Gekozen foto"><button type="button" data-foto-weg="${pre}" data-i="${i}" aria-label="Foto verwijderen">×</button></div>`);
  return bestaand.concat(nieuw).join("");
}
function wisKeuze(pre) {
  fotoNieuw[pre].forEach(f => URL.revokeObjectURL(f.url));
  fotoNieuw[pre] = []; fotoWeg[pre] = new Set();
}
async function uploadNieuw(pre, map, id) {
  const paden = [];
  for (let i = 0; i < fotoNieuw[pre].length; i++) {
    const pad = `${map}/${id}-${Date.now()}-${i}.jpg`;
    const up = await bewaarFoto(pad, fotoNieuw[pre][i].blob).catch(err => ({ error: err }));
    if (up.error) { console.error(up.error); await wisFotos(paden); return null; }
    paden.push(pad);
  }
  return paden;
}

/* ---------- Excel-export ---------- */
const EXCELJS_URL = "https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js";
function laadExcelJS() {
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  return new Promise((ok, nok) => {
    const sc = document.createElement("script");
    sc.src = EXCELJS_URL; sc.onload = () => ok(window.ExcelJS); sc.onerror = nok;
    document.head.appendChild(sc);
  });
}
// Kleine versie van de foto voor in Excel, zodat het bestand licht blijft.
async function fotoVoorExcel(pad) {
  const { data: blob } = await sb.storage.from(BUCKET).download(pad); if (!blob) return null;
  const bron = await createImageBitmap(blob).catch(() => null); if (!bron) return null;
  const k = Math.min(1, 160 / Math.max(bron.width, bron.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bron.width * k); c.height = Math.round(bron.height * k);
  c.getContext("2d").drawImage(bron, 0, 0, c.width, c.height);
  const b64 = c.toDataURL("image/jpeg", 0.8).split(",")[1];
  return { base64: b64, width: c.width, height: c.height };
}
const MAX_FOTOS_EXCEL = 4;
async function exporteerRonde(rondeId) {
  const r = rondes.find(x => x.id === rondeId); if (!r) return;
  let ExcelJS;
  try { ExcelJS = await laadExcelJS(); } catch { toast("Excel-export kon niet geladen worden. Controleer je internetverbinding."); return; }
  const t = typeVan(r.type), lijst = puntenVan(r.id);
  const breedte = Math.max(r.kolommen.length, ...lijst.map(p => p.waarden.length));
  const vast = Array.from({ length: breedte }, (_, i) => r.kolommen[i] || `Kolom ${i + 1}`);
  const nFoto = Math.min(MAX_FOTOS_EXCEL, Math.max(0, ...lijst.map(p => p.fotos.length)));
  const kolommen = [["Nr", 5], ...vast.map(k => [k, 18]), ["Genomen", 10], ["Staalnummer", 14]];
  if (t.temperatuur) kolommen.push(["Temperatuur (°C)", 12]);
  kolommen.push(["Opmerkingen", 36]);
  const opmKol = kolommen.length;
  for (let i = 0; i < nFoto; i++) kolommen.push([nFoto === 1 ? "Foto" : `Foto ${i + 1}`, 24]);
  const n = kolommen.length, genomen = lijst.filter(p => p.genomen).length;

  const wb = new ExcelJS.Workbook();
  wb.creator = "Staalnamen"; wb.created = new Date();
  const ws = wb.addWorksheet("Ronde", { pageSetup: { orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0, paperSize: 9 } });
  ws.columns = kolommen.map(([, w]) => ({ width: w }));
  ws.mergeCells(1, 1, 1, Math.max(n, 3));
  ws.getCell("A1").value = t.ronde;
  ws.getCell("A1").font = { bold: true, size: 16 };
  const info = [["Site", siteNaam(r.site)], ["Datum", fmtDate(r.datum)], ["Punten", `${lijst.length} (genomen: ${genomen}, te doen: ${lijst.length - genomen})`],
    ["Geëxporteerd op", new Date().toLocaleString("nl-BE")]];
  info.forEach(([k, v], i) => {
    const rij = ws.getRow(2 + i);
    rij.getCell(1).value = k; rij.getCell(1).font = { bold: true };
    ws.mergeCells(2 + i, 1, 2 + i, 2); ws.mergeCells(2 + i, 3, 2 + i, Math.max(n, 3));
    rij.getCell(3).value = v;
  });
  const KOP = 2 + info.length + 1;
  const kop = ws.getRow(KOP);
  kolommen.forEach(([titel], i) => {
    const cel = kop.getCell(i + 1);
    cel.value = titel; cel.font = { bold: true, color: { argb: "FFFFFFFF" } };
    cel.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF1D2220" } };
    cel.alignment = { vertical: "middle", wrapText: true };
  });
  kop.height = 30;
  ws.views = [{ state: "frozen", ySplit: KOP }];
  ws.pageSetup.printTitlesRow = `${KOP}:${KOP}`;
  const rand = { style: "thin", color: { argb: "FFDDE1DE" } };

  for (let i = 0; i < lijst.length; i++) {
    const p = lijst[i], rijNr = KOP + 1 + i;
    const rij = ws.getRow(rijNr);
    const waarden = [i + 1, ...vast.map((_, k) => p.waarden[k] || ""), p.genomen ? "Ja" : "Nee", p.staalnummer];
    if (t.temperatuur) waarden.push(p.temperatuur);
    waarden.push(p.fotos.length > nFoto ? [p.opmerkingen, `(+${p.fotos.length - nFoto} foto's in de app)`].filter(Boolean).join("\n") : p.opmerkingen);
    for (let k = 0; k < nFoto; k++) waarden.push("");
    rij.values = waarden;
    rij.eachCell({ includeEmpty: true }, cel => { cel.alignment = { vertical: "top", wrapText: true }; cel.border = { top: rand, bottom: rand, left: rand, right: rand }; });
    const gc = rij.getCell(vast.length + 2);
    gc.fill = { type: "pattern", pattern: "solid", fgColor: { argb: p.genomen ? "FFE3F2EA" : "FFFBE6E3" } };
    gc.font = { bold: true, color: { argb: p.genomen ? "FF1D7A4C" : "FFB0261C" } };
    rij.height = Math.max(30, Math.ceil((p.opmerkingen || "").length / 40) * 15 + 6);
    for (let k = 0; k < Math.min(nFoto, p.fotos.length); k++) {
      const f = await fotoVoorExcel(p.fotos[k]).catch(() => null);
      if (f) {
        const id = wb.addImage({ base64: f.base64, extension: "jpeg" });
        ws.addImage(id, { tl: { col: opmKol + k + 0.05, row: rijNr - 1 + 0.05 }, ext: { width: f.width, height: f.height }, editAs: "oneCell" });
        rij.height = Math.max(rij.height, f.height * 0.75 + 8);
      } else rij.getCell(opmKol + 1 + k).value = "(foto niet beschikbaar)";
    }
  }
  if (lijst.length) ws.autoFilter = { from: { row: KOP, column: 1 }, to: { row: KOP + lijst.length, column: opmKol } };
  else ws.getCell(`A${KOP + 1}`).value = "Geen punten in deze ronde.";

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const naam = `${t.ronde} ${siteNaam(r.site)} ${r.datum}.xlsx`.replace(/[\\/:*?"<>|]/g, "-");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = naam;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  toast("Excel-bestand gedownload");
}

/* ---------- Opslag (Supabase) ---------- */
const lijstRij = r => ({ site: r.site, type: r.type, kolommen: r.kolommen || [], punten: Array.isArray(r.punten) ? r.punten : [], bijgewerkt: r.bijgewerkt });
const rondeRij = r => ({ id: r.id, site: r.site, type: r.type, datum: r.datum, kolommen: r.kolommen || [], aangemaakt: r.aangemaakt });
const puntRij = r => ({ id: r.id, rondeId: r.ronde_id, volgorde: r.volgorde || 0, waarden: r.waarden || [], genomen: !!r.genomen, staalnummer: r.staalnummer || "",
  temperatuur: r.temperatuur || "", opmerkingen: r.opmerkingen || "", fotos: Array.isArray(r.fotos) ? r.fotos : [] });

// Supabase geeft max. 1000 rijen per keer terug; haal alles op in stukken.
async function selectAlles(tabel, sleutel) {
  const uit = [];
  for (let van = 0; ; van += 1000) {
    const { data, error } = await sb.from(tabel).select("*").order(sleutel).range(van, van + 999);
    if (error) return { error };
    uit.push(...data);
    if (data.length < 1000) return { data: uit, error: null };
  }
}

async function laadAlles() {
  const [l, r, p] = await Promise.all([selectAlles("staalpuntlijsten", "site"), selectAlles("staalrondes", "id"), selectAlles("staalronde_punten", "id")]);
  if (l.error || r.error || p.error) { banner("De gegevens konden niet geladen worden. Heb je toegang gekregen? Vraag het aan de beheerder."); return; }
  banner("");
  lijsten = l.data.map(lijstRij); rondes = r.data.map(rondeRij); punten = p.data.map(puntRij);
  ready = true;
  renderSafe();
}

async function write(fn, okMsg) {
  try {
    const { error } = await fn();
    if (error) throw error;
    if (okMsg) toast(okMsg);
    laadAlles();
    return true;
  } catch (e) {
    console.error(e);
    toast(e && (e.code === "42501" || /row-level security/i.test(e.message || "")) ? "Je hebt geen toegang om dit op te slaan." : "Opslaan mislukt. Controleer je verbinding en probeer opnieuw.");
    return false;
  }
}

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  const knop = f.querySelector("button[type=submit]");
  if (f.id === "form-login") {
    const email = $("#l-mail").value.trim();
    if (!email) return;
    knop.disabled = true;
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true } });
    knop.disabled = false;
    if (error) toast("Versturen mislukt: " + error.message);
    else f.innerHTML = `<h2>Kijk in je mailbox</h2><p style="margin:0">We stuurden een aanmeldlink naar <strong>${esc(email)}</strong>. Open die link op dit toestel.</p>`;
  } else if (f.id === "form-lijst") {
    const l = lijstUitPlak();
    if (!l.punten.length) { $("#lijst-plak").focus(); toast("Plak eerst de punten uit Excel"); return; }
    knop.disabled = true;
    const ok = await write(() => sb.from("staalpuntlijsten").upsert({ site: state.site, type: state.type, ...l, bijgewerkt: new Date().toISOString() }), `${l.punten.length} vaste punten opgeslagen`);
    knop.disabled = false;
    if (ok) { state.editLijst = false; render(); }
  } else if (f.id === "form-ronde") {
    const datum = $("#r-datum").value, l = lijstVan(state.site, state.type);
    if (!datum || !l || !l.punten.length) return;
    knop.disabled = true;
    const id = crypto.randomUUID();
    let ok = await write(() => sb.from("staalrondes").insert({ id, site: state.site, type: state.type, datum, kolommen: l.kolommen }));
    if (ok) {
      ok = await write(() => sb.from("staalronde_punten").insert(l.punten.map((w, i) => ({ id: crypto.randomUUID(), ronde_id: id, volgorde: i, waarden: w }))), "Ronde aangemaakt");
      if (!ok) await sb.from("staalrondes").delete().eq("id", id);
    }
    knop.disabled = false;
    if (ok) {
      await laadAlles();
      go("ronde", { ronde: id, filter: "alle" });
    }
  } else if (f.dataset.editForm) {
    const id = f.dataset.editForm, oud = punten.find(p => p.id === id); if (!oud) return;
    const r = rondes.find(x => x.id === oud.rondeId) || {};
    const d = {
      staalnummer: $("#e-staalnummer").value.trim(),
      opmerkingen: $("#e-opmerkingen").value.trim(),
      genomen: $("#e-genomen").checked,
    };
    if ($("#e-temperatuur")) d.temperatuur = $("#e-temperatuur").value.trim();
    knop.disabled = true;
    const nieuw = await uploadNieuw("e", `${r.site}/${r.id}`, id);
    if (!nieuw) { knop.disabled = false; toast("Een foto kon niet opgeslagen worden. Probeer opnieuw."); return; }
    const weg = oud.fotos.filter(p => fotoWeg.e.has(p));
    d.fotos = oud.fotos.filter(p => !fotoWeg.e.has(p)).concat(nieuw);
    const ok = await write(() => sb.from("staalronde_punten").update(d).eq("id", id), "Opgeslagen");
    knop.disabled = false;
    if (!ok) { wisFotos(nieuw); return; }
    wisFotos(weg); wisKeuze("e"); state.edit = null; render();
  } else if (f.id === "form-extra") {
    const tekst = $("#x-punt").value.trim(); if (!tekst) return;
    const r = rondes.find(x => x.id === state.ronde);
    const volgorde = Math.max(-1, ...puntenVan(r.id).map(p => p.volgorde)) + 1;
    knop.disabled = true;
    const ok = await write(() => sb.from("staalronde_punten").insert({ id: crypto.randomUUID(), ronde_id: r.id, volgorde, waarden: [tekst] }), "Punt toegevoegd");
    knop.disabled = false;
    if (ok) { $("#x-punt").value = ""; }
  } else if (f.id === "form-ronde-edit") {
    const datum = $("#re-datum").value;
    const ok = await write(() => sb.from("staalrondes").update({ datum }).eq("id", state.ronde), "Opgeslagen");
    if (ok) { state.editRonde = false; render(); }
  }
});

document.addEventListener("input", e => { if (e.target.id === "lijst-plak") toonLijstVoorbeeld(); });

document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "lijst-titels") { toonLijstVoorbeeld(); return; }
  if (t.dataset.genomen) {
    const ok = await write(() => sb.from("staalronde_punten").update({ genomen: t.checked }).eq("id", t.dataset.genomen));
    if (!ok) t.checked = !t.checked;
    return;
  }
  if (!t.dataset.fotoInput) return;
  const pre = t.dataset.fotoInput, files = [...(t.files || [])];
  if (!files.length) return;
  for (const file of files) { const blob = await verklein(file); fotoNieuw[pre].push({ blob, url: URL.createObjectURL(blob) }); }
  t.value = "";
  render();
});

document.addEventListener("click", async e => {
  const b = e.target.closest("button");
  if (!b) return;
  const d = b.dataset;
  if (b.id === "logout") { await sb.auth.signOut(); return; }
  if ("export" in d) { b.disabled = true; const t = b.textContent; b.textContent = "Bezig…"; try { await exporteerRonde(state.ronde); } finally { b.disabled = false; b.textContent = t; } return; }
  if (d.fotoWeg) {
    const pre = d.fotoWeg;
    if (d.pad) fotoWeg[pre].add(d.pad);
    else { const [f] = fotoNieuw[pre].splice(+d.i, 1); if (f) URL.revokeObjectURL(f.url); }
    render(); return;
  }
  if (d.groot) {
    const url = await fotoUrl(d.groot); if (!url) return;
    const ov = document.createElement("div"); ov.className = "groot"; ov.innerHTML = `<img alt="Foto bij punt">`;
    ov.querySelector("img").src = url; ov.addEventListener("click", () => ov.remove()); document.body.appendChild(ov);
    return;
  }
  if ("goSites" in d) go("sites");
  else if (d.goSite) go("site", { site: d.goSite });
  else if (d.goType) go("type", { type: d.goType });
  else if (d.goRonde) go("ronde", { ronde: d.goRonde, filter: "alle" });
  else if (d.filter) { state.filter = d.filter; render(); }
  else if ("confirm" in d) { state.confirm = d.confirm || null; render(); }
  else if (d.edit) { wisKeuze("e"); state.edit = d.edit; state.confirm = null; render(); }
  else if ("cancelEdit" in d) { wisKeuze("e"); state.edit = null; render(); }
  else if ("editRonde" in d) { state.editRonde = true; state.confirm = null; render(); }
  else if ("cancelRonde" in d) { state.editRonde = false; render(); }
  else if ("editLijst" in d) { state.editLijst = true; render(); $("#lijst-plak").focus(); }
  else if ("cancelLijst" in d) { state.editLijst = false; render(); }
  else if (d.delPunt) {
    const fotos = (punten.find(p => p.id === d.delPunt) || {}).fotos;
    if (await write(() => sb.from("staalronde_punten").delete().eq("id", d.delPunt), "Punt verwijderd")) { wisFotos(fotos); state.confirm = null; render(); }
  }
  else if ("delRonde" in d) {
    const r = rondes.find(x => x.id === state.ronde);
    // punten verdwijnen mee (on delete cascade)
    const fotos = puntenVan(r.id).flatMap(p => p.fotos);
    const ok = await write(() => sb.from("staalrondes").delete().eq("id", r.id), "Ronde verwijderd");
    if (ok) { wisFotos(fotos); go("type", { site: r.site, type: r.type }); }
  }
});

/* ---------- Opstart ---------- */
let kanaal = null;
function zetSessie(s) {
  const was = !!sessie;
  sessie = s;
  $("#who").hidden = !s;
  $("#who-mail").textContent = s ? s.user.email : "";
  if (s && !was) {
    laadAlles();
    kanaal = sb.channel("staalnamen-wijzigingen");
    ["staalpuntlijsten", "staalrondes", "staalronde_punten"].forEach(table =>
      kanaal.on("postgres_changes", { event: "*", schema: "public", table }, () => laadAlles()));
    kanaal.subscribe();
  }
  if (!s) { lijsten = []; rondes = []; punten = []; ready = false; if (kanaal) { sb.removeChannel(kanaal); kanaal = null; } }
  render();
}

render();
(async () => {
  const cfg = window.STAALNAMEN_CONFIG || {};
  if (!window.supabase || !cfg.supabaseUrl || !cfg.supabaseAnonKey) { banner("De app kon niet starten: de koppeling met de database ontbreekt (config.js)."); return; }
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  const { data } = await sb.auth.getSession();
  zetSessie(data.session);
  sb.auth.onAuthStateChange((_ev, s) => { if (!!s !== !!sessie) zetSessie(s); else sessie = s; });
  // Bij terugkeer naar de app (gsm) gegevens verversen.
  document.addEventListener("visibilitychange", () => { if (!document.hidden && sessie) laadAlles(); });
})();

// Niet opnieuw tekenen terwijl iemand een formulier invult; dat zou getypte tekst wissen.
function renderSafe() {
  const a = document.activeElement;
  const typing = a && a.matches && a.matches("input[type=text], textarea, select, input[type=date]") && a.value;
  if (typing) { clearTimeout(renderSafe.t); renderSafe.t = setTimeout(renderSafe, 1500); return; }
  render();
}
</script>
