<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Staalnamen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: smalle werkkolom; overzicht van sites → staalnamen van één site (breadcrumb-navigatie). Zelfde stijl als de veiligheidsrondes. */
:root {
  --bg: #f5f6f4;
  --surface: #ffffff;
  --fg: #1d2220;
  --muted: #5f6964;
  --line: #dde1de;
  --accent: #c8281e;      /* signaalrood, spaarzaam */
  --accent-fg: #ffffff;
  --open: #b0261c;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141816; --surface: #1d2220; --fg: #e9ecea; --muted: #9aa49f; --line: #2f3633;
    --accent: #ef5a4c; --accent-fg: #1a0b09; --open: #f07a6e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141816; --surface: #1d2220; --fg: #e9ecea; --muted: #9aa49f; --line: #2f3633;
  --accent: #ef5a4c; --accent-fg: #1a0b09; --open: #f07a6e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 24px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 2.2rem; text-transform: uppercase; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.25rem; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.who { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.login { max-width: 420px; }
.sign { width: 40px; height: 40px; flex: none; border-radius: 4px; background: var(--accent); display: grid; place-items: center; }
.sign svg { width: 24px; height: 24px; }
.eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .9rem; color: var(--muted); }
.crumbs button { background: none; border: 0; padding: 0; font: inherit; color: var(--fg); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.muted { color: var(--muted); }
button, input, select, textarea { font: inherit; color: inherit; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--radius); cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--open); }
.btn.small { padding: 4px 10px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Sites */
.sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.site { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; cursor: pointer; display: grid; gap: 10px; }
.site:hover { border-color: var(--muted); }
.site h3 { font-size: 1.35rem; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--bg); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.last { font-size: .85rem; color: var(--muted); }

/* Panels & forms */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.field { display: grid; gap: 4px; flex: 1 1 180px; min-width: 0; }
.field.wide { flex-basis: 100%; }
fieldset.loc-set { border: 0; padding: 0; margin: 0; }
fieldset.loc-set legend { padding: 0; margin-bottom: 4px; }
label.lbl.sub { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: .85rem; }
.lbl { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; color: var(--muted); }
input[type=text], input[type=date], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); padding: 8px 10px; border-radius: var(--radius); }
textarea { min-height: 72px; resize: vertical; }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }

/* Staalnamen */
.list { display: grid; gap: 8px; }
.staal { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--radius); padding: 12px 16px; display: grid; gap: 8px; }
.staal-top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; justify-content: space-between; }
.subject { font-weight: 600; }
.date { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.staal p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.meta { font-size: .9rem; color: var(--muted); overflow-wrap: anywhere; }
.fotos { display: flex; flex-wrap: wrap; gap: 8px; }
.foto-veld { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.foto-veld input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.foto-veld label.btn { cursor: pointer; }
.foto-keuze { position: relative; }
.foto-keuze button { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; padding: 0; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--open); cursor: pointer; line-height: 1; font-weight: 600; }
.duim { width: 96px; height: 72px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); display: block; }
button.duim-knop { padding: 0; border: 0; background: none; cursor: zoom-in; }
.groot { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.9); display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
.groot img { display: block; width: auto; height: auto; object-fit: contain; border-radius: 4px;
  max-width: calc(100vw - 32px);
  max-height: calc(100vh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  max-height: calc(100dvh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
.staal-bottom { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: flex-end; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button[aria-pressed=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 24px 16px; text-align: center; color: var(--muted); }
.banner { padding: 10px 14px; border-radius: var(--radius); background: #fbefd9; color: #9a5b00; font-size: .9rem; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-size: .9rem; }
@media (prefers-reduced-motion: no-preference) { .site, .btn { transition: border-color .15s, filter .15s; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="sign" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M9 2.5h6M10 2.5v6.2L4.8 18.3A2.2 2.2 0 0 0 6.7 21.5h10.6a2.2 2.2 0 0 0 1.9-3.2L14 8.7V2.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.2 15h9.6l2 3.5a1 1 0 0 1-.9 1.5H6.1a1 1 0 0 1-.9-1.5Z" fill="#fff"/></svg>
    </div>
    <div>
      <div class="eyebrow">Registratie</div>
      <h1>Staalnamen</h1>
    </div>
    <div id="who" class="who" hidden><span id="who-mail"></span><button class="btn small" id="logout" type="button">Afmelden</button></div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const SITES = [
  { id: "pz-tienen", naam: "Psychiatrisch ziekenhuis Tienen" },
  { id: "wzc-sint-alexius", naam: "WZC Sint-Alexius" },
  { id: "wzc-passionisten", naam: "WZC-Passionisten" },
  { id: "wzc-huize-nazareth", naam: "WZC-Huize Nazareth" },
  { id: "psc-leuven", naam: "PSC-Leuven" },
  { id: "hestia", naam: "Hestia" },
];
const STAALTYPES = ["Water (legionella)", "Drinkwater", "Oppervlak (hygiëne)", "Lucht", "Voeding", "Andere"];
const TABEL = "staalnamen", BUCKET = "staalnamen-fotos";
const UITVOERDER_KEY = "staalnamen-uitvoerder";

let sb = null, sessie = null, ready = false;
let staalnamen = []; // {id, site, datum, gebouw, verdiep, lokaal, staaltype, staalnummer, uitvoerder, opmerkingen, fotos[], aangemaakt}
let state = { view: "sites", site: null, type: "alle", edit: null, confirm: null };

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fmtDate = iso => { if (!iso) return "—"; const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; };
const siteNaam = id => (SITES.find(s => s.id === id) || {}).naam || id;
const locTekst = o => [o.gebouw, o.verdiep ? "verdiep " + o.verdiep : "", o.lokaal].filter(Boolean).join(", ");
const nieuwsteEerst = (a, b) => (b.datum || "").localeCompare(a.datum || "") || (b.aangemaakt || "").localeCompare(a.aangemaakt || "");
const leesUitvoerder = () => { try { return localStorage.getItem(UITVOERDER_KEY) || ""; } catch { return ""; } };
const bewaarUitvoerder = v => { try { localStorage.setItem(UITVOERDER_KEY, v); } catch {} };

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200);
}
function banner(msg) { const b = $("#banner"); b.textContent = msg || ""; b.hidden = !msg; }

function go(view, extra = {}) {
  wisKeuze("o"); wisKeuze("e");
  state = { ...state, view, edit: null, confirm: null, ...extra };
  render();
  window.scrollTo({ top: 0 });
}

/* ---------- Views ---------- */
let lastKey = "";
function render() {
  const v = $("#view");
  const key = state.view + ":" + state.site;
  const keep = {};
  if (key === lastKey) v.querySelectorAll("form input[id]:not([type=file]), form textarea[id], form select[id]").forEach(el => keep[el.id] = el.value);
  if (!sessie) { v.innerHTML = viewLogin(); lastKey = ""; return; }
  v.innerHTML = state.view === "site" ? viewSite() : viewSites();
  for (const id in keep) { const el = document.getElementById(id); if (el && el.closest("form")) el.value = keep[id]; }
  lastKey = key;
  toonFotos();
}

function viewLogin() {
  if (!sb) return '<div class="empty">Laden…</div>';
  return `<form class="panel login" id="form-login">
    <h2>Aanmelden</h2>
    <p class="muted" style="margin:0">Vul je e-mailadres in. Je krijgt een mail met een link om je aan te melden.</p>
    <div class="field"><label class="lbl" for="l-mail">E-mailadres</label><input type="text" inputmode="email" autocomplete="email" id="l-mail" required></div>
    <button class="btn primary" type="submit">Stuur aanmeldlink</button>
  </form>`;
}

function viewSites() {
  const cards = SITES.map(s => {
    const ss = staalnamen.filter(x => x.site === s.id);
    const last = ss.map(x => x.datum).sort().pop();
    return `<button class="site" data-go-site="${s.id}">
      <h3>${esc(s.naam)}</h3>
      <div class="stats"><span class="pill">${ss.length} ${ss.length === 1 ? "staalname" : "staalnamen"}</span></div>
      <div class="last">${!ready ? "Laden…" : last ? "Laatste staalname " + fmtDate(last) : "Nog geen staalname"}</div>
    </button>`;
  }).join("");
  return `<div style="display:grid;gap:12px"><p class="muted" style="margin:0">Kies een site om een staalname te registreren of eerdere stalen op te zoeken.</p><div class="sites">${cards}</div></div>`;
}

function staalForm(o) {
  const e = o || { datum: today(), uitvoerder: leesUitvoerder() };
  const pre = o ? "e" : "o";
  return `<div class="row">
      <div class="field" style="flex:0 1 170px"><label class="lbl" for="${pre}-datum">Datum</label><input type="date" id="${pre}-datum" required value="${esc(e.datum)}"></div>
      <div class="field"><label class="lbl" for="${pre}-staaltype">Staaltype</label>
        <select id="${pre}-staaltype" required>
          ${o ? "" : '<option value="" disabled selected>Kies een staaltype</option>'}
          ${STAALTYPES.concat(o && !STAALTYPES.includes(e.staaltype) ? [e.staaltype] : []).map(x => `<option ${e.staaltype === x ? "selected" : ""}>${esc(x)}</option>`).join("")}
        </select></div>
      <div class="field"><label class="lbl" for="${pre}-staalnummer">Staalnummer</label><input type="text" id="${pre}-staalnummer" value="${esc(e.staalnummer)}" placeholder="bv. etiket van het labo"></div>
      <div class="field"><label class="lbl" for="${pre}-uitvoerder">Uitvoerder</label><input type="text" id="${pre}-uitvoerder" value="${esc(e.uitvoerder)}" placeholder="Naam" autocomplete="name"></div>
      <fieldset class="field wide loc-set"><legend class="lbl">Locatie</legend>
        <div class="row">
          <div class="field"><label class="lbl sub" for="${pre}-gebouw">Gebouw</label><input type="text" id="${pre}-gebouw" value="${esc(e.gebouw)}" placeholder="bv. Gebouw B"></div>
          <div class="field" style="flex-basis:110px"><label class="lbl sub" for="${pre}-verdiep">Verdiep</label><input type="text" id="${pre}-verdiep" value="${esc(e.verdiep)}" placeholder="bv. 2"></div>
          <div class="field"><label class="lbl sub" for="${pre}-lokaal">Lokaal / tappunt</label><input type="text" id="${pre}-lokaal" value="${esc(e.lokaal)}" placeholder="bv. B2.14, douche"></div>
        </div>
      </fieldset>
      <div class="field wide"><label class="lbl" for="${pre}-opmerkingen">Opmerkingen</label><textarea id="${pre}-opmerkingen" placeholder="bv. temperatuur, bijzonderheden">${esc(e.opmerkingen)}</textarea></div>
      <div class="field wide"><span class="lbl">Foto's</span>
        <div class="foto-veld">
          ${fotoVoorbeelden(pre, e)}
          <input type="file" accept="image/*" capture="environment" id="${pre}-camera" data-foto-input="${pre}">
          <label class="btn" for="${pre}-camera">Foto nemen</label>
          <input type="file" accept="image/*" multiple id="${pre}-bestand" data-foto-input="${pre}">
          <label class="btn" for="${pre}-bestand">Foto's kiezen</label>
        </div>
      </div>
    </div>
    <div class="head">
      <span></span>
      <div class="actions">
        ${o ? '<button type="button" class="btn" data-cancel-edit>Annuleren</button>' : ""}
        <button class="btn primary" type="submit">${o ? "Opslaan" : "Staalname toevoegen"}</button>
      </div>
    </div>`;
}

function viewSite() {
  const s = state.site;
  const all = staalnamen.filter(x => x.site === s).sort(nieuwsteEerst);
  const shown = state.type === "alle" ? all : all.filter(x => x.staaltype === state.type);
  const list = shown.map(o => {
    if (state.edit === o.id) return `<form class="panel" data-edit-form="${o.id}"><h3>Staalname bewerken</h3>${staalForm(o)}</form>`;
    const conf = state.confirm === o.id;
    const meta = [locTekst(o), o.uitvoerder ? "door " + o.uitvoerder : ""].filter(Boolean).join(" · ");
    return `<article class="staal">
      <div class="staal-top">
        <span><span class="subject">${esc(o.staaltype)}</span>${o.staalnummer ? ` <span class="muted">· nr. ${esc(o.staalnummer)}</span>` : ""}</span>
        <span class="date">${fmtDate(o.datum)}</span>
      </div>
      ${meta ? `<div class="meta">${esc(meta)}</div>` : ""}
      ${o.opmerkingen ? `<p>${esc(o.opmerkingen)}</p>` : ""}
      ${o.fotos.length ? `<div class="fotos">${o.fotos.map(f => `<button type="button" class="duim-knop" data-groot="${esc(f)}" aria-label="Foto vergroten"><img class="duim" data-foto="${esc(f)}" alt="Foto bij staalname"></button>`).join("")}</div>` : ""}
      <div class="staal-bottom">
        <div class="actions">
          ${conf
            ? `<span class="muted" style="align-self:center">Verwijderen?</span><button class="btn small danger" data-del="${o.id}">Ja, verwijderen</button><button class="btn small" data-confirm="">Nee</button>`
            : `<button class="btn small" data-edit="${o.id}">Bewerken</button><button class="btn small danger" data-confirm="${o.id}">Verwijderen</button>`}
        </div>
      </div>
    </article>`;
  }).join("");
  const types = STAALTYPES.concat([...new Set(all.map(x => x.staaltype))].filter(t => !STAALTYPES.includes(t)));
  const filt = [["alle", `Alle (${all.length})`]].concat(types.map(t => [t, `${t} (${all.filter(x => x.staaltype === t).length})`]).filter(([t]) => all.some(x => x.staaltype === t) || t === state.type))
    .map(([t, lbl]) => `<button class="btn small" aria-pressed="${state.type === t}" data-type="${esc(t)}">${esc(lbl)}</button>`).join("");
  return `<div style="display:grid;gap:20px">
    <nav class="crumbs"><button data-go-sites>Alle sites</button><span>/</span><span>${esc(siteNaam(s))}</span></nav>
    <h2>${esc(siteNaam(s))}</h2>
    <form class="panel" id="form-staal"><h3>Nieuwe staalname</h3>${staalForm(null)}</form>
    <div style="display:grid;gap:10px">
      <div class="head"><h3>Staalnamen</h3>${all.length ? `<div class="filters">${filt}</div>` : ""}</div>
      ${!ready ? '<div class="empty">Staalnamen laden…</div>' : shown.length ? `<div class="list">${list}</div>` : `<div class="empty">${all.length ? "Geen staalnamen van dit type." : "Nog geen staalnamen voor deze site. Voeg hierboven de eerste toe."}</div>`}
    </div>
    <form class="panel" id="form-export">
      <h3>Excel-export</h3>
      <p class="muted" style="margin:0">Exporteert de staalnamen van deze site${state.type === "alle" ? "" : ` van het type <strong>${esc(state.type)}</strong>`}. Laat de datums leeg voor alles.</p>
      <div class="row">
        <div class="field" style="flex:0 1 170px"><label class="lbl" for="x-van">Van</label><input type="date" id="x-van"></div>
        <div class="field" style="flex:0 1 170px"><label class="lbl" for="x-tot">Tot en met</label><input type="date" id="x-tot"></div>
        <button class="btn primary" type="submit">Excel-export</button>
      </div>
    </form>
  </div>`;
}

/* ---------- Foto's (Supabase Storage, bucket "staalnamen-fotos") ---------- */
const fotoUrls = new Map();
async function fotoUrl(pad) {
  if (fotoUrls.has(pad)) return fotoUrls.get(pad);
  const { data } = await sb.storage.from(BUCKET).createSignedUrl(pad, 60 * 60 * 12);
  const url = data && data.signedUrl;
  if (url) fotoUrls.set(pad, url);
  return url;
}
function bewaarFoto(pad, blob) { return sb.storage.from(BUCKET).upload(pad, blob, { upsert: true, contentType: "image/jpeg" }); }
async function wisFotos(paden) {
  paden = (paden || []).filter(Boolean); if (!paden.length) return;
  paden.forEach(p => fotoUrls.delete(p));
  try { await sb.storage.from(BUCKET).remove(paden); } catch (e) { console.error(e); }
}
function toonFotos() {
  document.querySelectorAll("img[data-foto]").forEach(async img => {
    const url = await fotoUrl(img.dataset.foto);
    if (url && img.isConnected) img.src = url;
  });
}
// Foto verkleinen tot max. 1600 px, JPEG: kleiner bestand, sneller opladen.
async function verklein(file) {
  const bron = await createImageBitmap(file).catch(() => null);
  if (!bron) return file;
  const k = Math.min(1, 1600 / Math.max(bron.width, bron.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bron.width * k); c.height = Math.round(bron.height * k);
  c.getContext("2d").drawImage(bron, 0, 0, c.width, c.height);
  return new Promise(ok => c.toBlob(b => ok(b || file), "image/jpeg", 0.8));
}
// Gekozen maar nog niet opgeslagen foto's per formulier ("o" = nieuw, "e" = bewerken).
const fotoNieuw = { o: [], e: [] };        // [{ blob, url }]
const fotoWeg = { o: new Set(), e: new Set() }; // bestaande paden die weg moeten
function fotoVoorbeelden(pre, e) {
  const bestaand = (e.fotos || []).filter(p => !fotoWeg[pre].has(p)).map(p =>
    `<div class="foto-keuze"><img class="duim" data-foto="${esc(p)}" alt="Huidige foto"><button type="button" data-foto-weg="${pre}" data-pad="${esc(p)}" aria-label="Foto verwijderen">×</button></div>`);
  const nieuw = fotoNieuw[pre].map((f, i) =>
    `<div class="foto-keuze"><img class="duim" src="${f.url}" alt="Gekozen foto"><button type="button" data-foto-weg="${pre}" data-i="${i}" aria-label="Foto verwijderen">×</button></div>`);
  return bestaand.concat(nieuw).join("");
}
function wisKeuze(pre) {
  fotoNieuw[pre].forEach(f => URL.revokeObjectURL(f.url));
  fotoNieuw[pre] = []; fotoWeg[pre] = new Set();
}
async function uploadNieuw(pre, site, id) {
  const paden = [];
  for (let i = 0; i < fotoNieuw[pre].length; i++) {
    const pad = `${site}/${id}-${Date.now()}-${i}.jpg`;
    const up = await bewaarFoto(pad, fotoNieuw[pre][i].blob).catch(err => ({ error: err }));
    if (up.error) { console.error(up.error); await wisFotos(paden); return null; }
    paden.push(pad);
  }
  return paden;
}

/* ---------- Excel-export ---------- */
const EXCELJS_URL = "https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js";
function laadExcelJS() {
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  return new Promise((ok, nok) => {
    const sc = document.createElement("script");
    sc.src = EXCELJS_URL; sc.onload = () => ok(window.ExcelJS); sc.onerror = nok;
    document.head.appendChild(sc);
  });
}
// Kleine versie van de foto voor in Excel, zodat het bestand licht blijft.
async function fotoVoorExcel(pad) {
  const { data: blob } = await sb.storage.from(BUCKET).download(pad); if (!blob) return null;
  const bron = await createImageBitmap(blob).catch(() => null); if (!bron) return null;
  const k = Math.min(1, 160 / Math.max(bron.width, bron.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bron.width * k); c.height = Math.round(bron.height * k);
  c.getContext("2d").drawImage(bron, 0, 0, c.width, c.height);
  const b64 = c.toDataURL("image/jpeg", 0.8).split(",")[1];
  return { base64: b64, width: c.width, height: c.height };
}
const MAX_FOTOS_EXCEL = 4;
async function exporteer(site, type, van, tot) {
  let ExcelJS;
  try { ExcelJS = await laadExcelJS(); } catch { toast("Excel-export kon niet geladen worden. Controleer je internetverbinding."); return; }
  const lijst = staalnamen.filter(x => x.site === site && (type === "alle" || x.staaltype === type) && (!van || x.datum >= van) && (!tot || x.datum <= tot))
    .sort((a, b) => (a.datum || "").localeCompare(b.datum || "") || (a.aangemaakt || "").localeCompare(b.aangemaakt || ""));
  const nFoto = Math.min(MAX_FOTOS_EXCEL, Math.max(0, ...lijst.map(x => x.fotos.length)));

  const wb = new ExcelJS.Workbook();
  wb.creator = "Staalnamen"; wb.created = new Date();
  const ws = wb.addWorksheet("Staalnamen", { pageSetup: { orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0, paperSize: 9 } });
  const kolommen = [["Nr", 5], ["Datum", 11], ["Staalnummer", 14], ["Staaltype", 20], ["Gebouw", 14], ["Verdiep", 9], ["Lokaal / tappunt", 16], ["Uitvoerder", 16], ["Opmerkingen", 40]];
  for (let i = 0; i < nFoto; i++) kolommen.push([nFoto === 1 ? "Foto" : `Foto ${i + 1}`, 24]);
  ws.columns = kolommen.map(([, w]) => ({ width: w }));
  const n = kolommen.length;
  ws.mergeCells(1, 1, 1, n);
  ws.getCell("A1").value = "Staalnamen";
  ws.getCell("A1").font = { bold: true, size: 16 };
  const periode = van || tot ? `${van ? fmtDate(van) : "begin"} – ${tot ? fmtDate(tot) : "vandaag"}` : "Alle datums";
  const info = [["Site", siteNaam(site)], ["Periode", periode], ["Staaltype", type === "alle" ? "Alle" : type],
    ["Aantal staalnamen", String(lijst.length)], ["Geëxporteerd op", new Date().toLocaleString("nl-BE")]];
  info.forEach(([k, v], i) => {
    const rij = ws.getRow(2 + i);
    rij.getCell(1).value = k; rij.getCell(1).font = { bold: true };
    ws.mergeCells(2 + i, 1, 2 + i, 2); ws.mergeCells(2 + i, 3, 2 + i, n);
    rij.getCell(3).value = v;
  });
  const KOP = 2 + info.length + 1;
  const kop = ws.getRow(KOP);
  kolommen.forEach(([t], i) => {
    const cel = kop.getCell(i + 1);
    cel.value = t; cel.font = { bold: true, color: { argb: "FFFFFFFF" } };
    cel.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF1D2220" } };
    cel.alignment = { vertical: "middle" };
  });
  kop.height = 20;
  ws.views = [{ state: "frozen", ySplit: KOP }];
  ws.pageSetup.printTitlesRow = `${KOP}:${KOP}`;
  const rand = { style: "thin", color: { argb: "FFDDE1DE" } };

  for (let i = 0; i < lijst.length; i++) {
    const o = lijst[i], rijNr = KOP + 1 + i;
    const rij = ws.getRow(rijNr);
    const waarden = [i + 1, fmtDate(o.datum), o.staalnummer, o.staaltype, o.gebouw, o.verdiep, o.lokaal, o.uitvoerder, o.opmerkingen];
    for (let k = 0; k < nFoto; k++) waarden.push(k === 0 && !o.fotos.length ? "—" : "");
    rij.values = waarden;
    rij.eachCell({ includeEmpty: true }, cel => { cel.alignment = { vertical: "top", wrapText: true }; cel.border = { top: rand, bottom: rand, left: rand, right: rand }; });
    rij.height = Math.max(30, Math.ceil((o.opmerkingen || "").length / 45) * 15 + 6);
    for (let k = 0; k < Math.min(nFoto, o.fotos.length); k++) {
      const f = await fotoVoorExcel(o.fotos[k]).catch(() => null);
      if (f) {
        const id = wb.addImage({ base64: f.base64, extension: "jpeg" });
        ws.addImage(id, { tl: { col: 9 + k + 0.05, row: rijNr - 1 + 0.05 }, ext: { width: f.width, height: f.height }, editAs: "oneCell" });
        rij.height = Math.max(rij.height, f.height * 0.75 + 8);
      } else rij.getCell(10 + k).value = "(foto niet beschikbaar)";
    }
    if (o.fotos.length > nFoto) rij.getCell(9).value = [o.opmerkingen, `(+${o.fotos.length - nFoto} foto's in de app)`].filter(Boolean).join("\n");
  }
  if (lijst.length) ws.autoFilter = { from: { row: KOP, column: 1 }, to: { row: KOP + lijst.length, column: 9 } };
  else ws.getCell(`A${KOP + 1}`).value = "Geen staalnamen in deze selectie.";

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const naam = `Staalnamen ${siteNaam(site)}${type === "alle" ? "" : " " + type}${van || tot ? ` ${van || "begin"} tot ${tot || today()}` : ""}.xlsx`.replace(/[\\/:*?"<>|]/g, "-");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = naam;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  toast("Excel-bestand gedownload");
}

/* ---------- Opslag (Supabase, tabel "staalnamen") ---------- */
const fromRow = r => ({ id: r.id, site: r.site, datum: r.datum, gebouw: r.gebouw || "", verdiep: r.verdiep || "", lokaal: r.lokaal || "",
  staaltype: r.staaltype, staalnummer: r.staalnummer || "", uitvoerder: r.uitvoerder || "", opmerkingen: r.opmerkingen || "",
  fotos: Array.isArray(r.fotos) ? r.fotos : [], aangemaakt: r.aangemaakt });

async function laadAlles() {
  const r = await sb.from(TABEL).select("*");
  if (r.error) { banner("De gegevens konden niet geladen worden. Heb je toegang gekregen? Vraag het aan de beheerder."); return; }
  banner("");
  staalnamen = r.data.map(fromRow);
  ready = true;
  renderSafe();
}

async function write(fn, okMsg) {
  try {
    const { error } = await fn();
    if (error) throw error;
    if (okMsg) toast(okMsg);
    laadAlles();
    return true;
  } catch (e) {
    console.error(e);
    toast(e && (e.code === "42501" || /row-level security/i.test(e.message || "")) ? "Je hebt geen toegang om dit op te slaan." : "Opslaan mislukt. Controleer je verbinding en probeer opnieuw.");
    return false;
  }
}

function readStaalForm(pre) {
  return {
    datum: $(`#${pre}-datum`).value,
    staaltype: $(`#${pre}-staaltype`).value,
    staalnummer: $(`#${pre}-staalnummer`).value.trim(),
    uitvoerder: $(`#${pre}-uitvoerder`).value.trim(),
    gebouw: $(`#${pre}-gebouw`).value.trim(),
    verdiep: $(`#${pre}-verdiep`).value.trim(),
    lokaal: $(`#${pre}-lokaal`).value.trim(),
    opmerkingen: $(`#${pre}-opmerkingen`).value.trim(),
  };
}

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "form-login") {
    const email = $("#l-mail").value.trim();
    if (!email) return;
    const btn = f.querySelector("button"); btn.disabled = true;
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true } });
    btn.disabled = false;
    if (error) toast("Versturen mislukt: " + error.message);
    else f.innerHTML = `<h2>Kijk in je mailbox</h2><p style="margin:0">We stuurden een aanmeldlink naar <strong>${esc(email)}</strong>. Open die link op dit toestel.</p>`;
  } else if (f.id === "form-staal") {
    const d = readStaalForm("o");
    if (!d.datum) { $("#o-datum").focus(); return; }
    if (!d.staaltype) { $("#o-staaltype").focus(); toast("Kies een staaltype"); return; }
    const id = crypto.randomUUID(), site = state.site;
    const knop = f.querySelector("button[type=submit]"); knop.disabled = true;
    const fotos = await uploadNieuw("o", site, id);
    if (!fotos) { knop.disabled = false; toast("Een foto kon niet opgeslagen worden. Probeer opnieuw."); return; }
    const ok = await write(() => sb.from(TABEL).insert({ ...d, id, site, fotos }), "Staalname toegevoegd");
    knop.disabled = false;
    if (!ok) { wisFotos(fotos); return; }
    if (d.uitvoerder) bewaarUitvoerder(d.uitvoerder);
    wisKeuze("o"); lastKey = ""; render();
  } else if (f.dataset.editForm) {
    const id = f.dataset.editForm, d = readStaalForm("e");
    if (!d.datum) { $("#e-datum").focus(); return; }
    const oud = staalnamen.find(x => x.id === id); if (!oud) return;
    const knop = f.querySelector("button[type=submit]"); knop.disabled = true;
    const nieuw = await uploadNieuw("e", oud.site, id);
    if (!nieuw) { knop.disabled = false; toast("Een foto kon niet opgeslagen worden. Probeer opnieuw."); return; }
    const weg = oud.fotos.filter(p => fotoWeg.e.has(p));
    d.fotos = oud.fotos.filter(p => !fotoWeg.e.has(p)).concat(nieuw);
    const ok = await write(() => sb.from(TABEL).update(d).eq("id", id), "Opgeslagen");
    knop.disabled = false;
    if (!ok) { wisFotos(nieuw); return; }
    wisFotos(weg); wisKeuze("e"); state.edit = null; render();
  } else if (f.id === "form-export") {
    const van = $("#x-van").value, tot = $("#x-tot").value;
    if (van && tot && van > tot) { toast("De begindatum ligt na de einddatum"); return; }
    const knop = f.querySelector("button[type=submit]"); knop.disabled = true; const t = knop.textContent; knop.textContent = "Bezig…";
    try { await exporteer(state.site, state.type, van, tot); } finally { knop.disabled = false; knop.textContent = t; }
  }
});

document.addEventListener("change", async e => {
  const t = e.target;
  if (!t.dataset.fotoInput) return;
  const pre = t.dataset.fotoInput, files = [...(t.files || [])];
  if (!files.length) return;
  for (const file of files) { const blob = await verklein(file); fotoNieuw[pre].push({ blob, url: URL.createObjectURL(blob) }); }
  t.value = "";
  render();
});

document.addEventListener("click", async e => {
  const b = e.target.closest("button");
  if (!b) return;
  const d = b.dataset;
  if (b.id === "logout") { await sb.auth.signOut(); return; }
  if (d.fotoWeg) {
    const pre = d.fotoWeg;
    if (d.pad) fotoWeg[pre].add(d.pad);
    else { const [f] = fotoNieuw[pre].splice(+d.i, 1); if (f) URL.revokeObjectURL(f.url); }
    render(); return;
  }
  if (d.groot) {
    const url = await fotoUrl(d.groot); if (!url) return;
    const ov = document.createElement("div"); ov.className = "groot"; ov.innerHTML = `<img alt="Foto bij staalname">`;
    ov.querySelector("img").src = url; ov.addEventListener("click", () => ov.remove()); document.body.appendChild(ov);
    return;
  }
  if ("goSites" in d) go("sites");
  else if (d.goSite) go("site", { site: d.goSite, type: "alle" });
  else if (d.type) { state.type = d.type; render(); }
  else if ("confirm" in d) { state.confirm = d.confirm || null; render(); }
  else if (d.edit) { lastKey = ""; wisKeuze("e"); state.edit = d.edit; state.confirm = null; render(); }
  else if ("cancelEdit" in d) { wisKeuze("e"); state.edit = null; render(); }
  else if (d.del) {
    const fotos = (staalnamen.find(x => x.id === d.del) || {}).fotos;
    if (await write(() => sb.from(TABEL).delete().eq("id", d.del), "Staalname verwijderd")) { wisFotos(fotos); state.confirm = null; render(); }
  }
});

/* ---------- Opstart ---------- */
let kanaal = null;
function zetSessie(s) {
  const was = !!sessie;
  sessie = s;
  $("#who").hidden = !s;
  $("#who-mail").textContent = s ? s.user.email : "";
  if (s && !was) {
    laadAlles();
    kanaal = sb.channel("staalnamen-wijzigingen")
      .on("postgres_changes", { event: "*", schema: "public", table: TABEL }, () => laadAlles())
      .subscribe();
  }
  if (!s) { staalnamen = []; ready = false; if (kanaal) { sb.removeChannel(kanaal); kanaal = null; } }
  render();
}

render();
(async () => {
  const cfg = window.STAALNAMEN_CONFIG || {};
  if (!window.supabase || !cfg.supabaseUrl || !cfg.supabaseAnonKey) { banner("De app kon niet starten: de koppeling met de database ontbreekt (config.js)."); return; }
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  const { data } = await sb.auth.getSession();
  zetSessie(data.session);
  sb.auth.onAuthStateChange((_ev, s) => { if (!!s !== !!sessie) zetSessie(s); else sessie = s; });
  // Bij terugkeer naar de app (gsm) gegevens verversen.
  document.addEventListener("visibilitychange", () => { if (!document.hidden && sessie) laadAlles(); });
})();

// Niet opnieuw tekenen terwijl iemand een formulier invult; dat zou getypte tekst wissen.
function renderSafe() {
  const a = document.activeElement;
  const typing = a && a.matches && a.matches("input[type=text], textarea, select, input[type=date]") && a.value;
  if (typing) { clearTimeout(renderSafe.t); renderSafe.t = setTimeout(renderSafe, 1500); return; }
  render();
}
</script>
